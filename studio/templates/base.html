<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}Studio{% endblock %} · Radiospot-Studio</title>
  <link rel="stylesheet" href="/static/studio.css">
</head>
<body class="{% block body_class %}{% endblock %}">
{% if user %}
<header class="topbar">
  <a class="brand" href="/"><span class="dot"></span>Radiospot-Studio</a>
  <nav>
    <a href="/">Arbeitsfläche</a>
    {% if user.role == 'admin' %}<a href="/admin/users">Benutzer</a><a href="/admin/voices">KI-Stimmen</a>{% endif %}
    <a href="/account">Mein Konto</a>
  </nav>
  <form method="post" action="/logout" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link">{{ user.name or user.email }} ({{ roles[user.role] }}) · Abmelden</button>
  </form>
</header>
{% endif %}
<main>
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
