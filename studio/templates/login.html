{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<form method="post" action="/login" class="card narrow">
  <div class="brand big"><span class="dot"></span>Radiospot-Studio</div>
  <p class="help">Zugang nur für freigeschaltete Konten. Einen Zugang vergibt onaircraft.</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>E-Mail <input name="email" type="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
  <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primary">Anmelden</button>
</form>
{% endblock %}
