{% extends "admin/base.html" %}
{% block title %}Mein Konto{% endblock %}
{% block content %}
<h1>Mein Konto</h1>
<p>Angemeldet als <strong>{{ user.username }}</strong> · Rolle: {{ roles[user.role] }}</p>
<form method="post" action="/admin/password" class="card form">
  <h2>Passwort ändern</h2>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Aktuelles Passwort <input name="current" type="password" autocomplete="current-password" required></label>
  <label>Neues Passwort (min. 10 Zeichen) <input name="new" type="password" autocomplete="new-password" minlength="10" required></label>
  <div class="buttons"><button class="primary">Passwort ändern</button></div>
</form>
{% endblock %}
