<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radiospot-Konfigurator — onaircraft</title>
{% if fonts_url %}
<link href="{{ fonts_url }}" rel="stylesheet">
{% endif %}
<link rel="stylesheet" href="/static/configurator.css?v={{ static_v }}">
<!-- Farben & Schriften aus Admin → Design -->
<link rel="stylesheet" href="/theme.css?v={{ theme_version }}">
</head>
<body class="{{ body_class }}">

<header class="top">
  <div class="wrap top-inner">
    {% if logo %}<img class="logo" src="{{ logo.url }}" alt="onaircraft" style="height: {{ logo.height }}px">
    {% else %}<div class="wordmark">on<span>air</span>craft</div>{% endif %}
    <div class="tag">{{ design.tagline }}</div>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <h1>{{ design.hero_title }}</h1>
    <div class="wave" id="wave"></div>
  </section>

  <!-- data-api: Basis-URL des Backends (leer = gleiche Domain) -->
  <section class="panel" id="radiospot-configurator" data-api="" data-game-levels="{{ design.game_levels }}"
           data-show-cta="{{ design.show_cta }}" data-show-firma="{{ design.show_firma }}">
    <div class="dial">
      <div class="dial-row" id="dialRow"></div>
      <div class="track"><div class="needle" id="needle"></div></div>
    </div>

    <div id="stepHost"><div class="step"><p class="hint">Konfigurator wird geladen …</p></div></div>

    <div class="row-actions">
      <button class="btn ghost" id="btnBack" type="button">Zurück</button>
      <button class="btn" id="btnNext" type="button">Weiter</button>
    </div>
  </section>

  <footer>© onaircraft sound so(u)lutions, Wien · <a href="/agb">AGB</a> · <a href="/datenschutz">Datenschutz</a></footer>
</div>

<script src="/static/coverage-map.js?v={{ static_v }}" defer></script>
<script src="/static/wheel.js?v={{ static_v }}" defer></script>
<script src="/static/configurator.js?v={{ static_v }}" defer></script>
{% if design.layout_game == "on" %}<script src="/static/gamify.js?v={{ static_v }}" defer></script>{% endif %}
</body>
</html>
